site_name: OPA PBAC Proof of Concept
site_description: Policy-Based Access Control using Open Policy Agent with AWS API Gateway
site_author: OPA PBAC POC Team
site_url: https://your-domain.github.io/opa-pbac-poc

# Repository
repo_name: opa-pbac-poc
repo_url: https://github.com/your-org/opa-pbac-poc
edit_uri: edit/main/docs/

# Configuration
theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

# Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

# Navigation
nav:
  - Home: index.md
  - Quick Start: quick-start.md
  - Architecture:
    - Overview: architecture/overview.md
    - XACML Components: architecture/xacml.md
    - Data Flow: architecture/data-flow.md
  - Policies:
    - Overview: policies/index.md
    - DNC Policy: policies/dnc.md
    - Authorization Policy: policies/authz.md
    - Testing: policies/testing.md
  - Services:
    - SAM Application: services/sam-app.md
    - Mock Services: services/mock-services.md
    - PAP Dashboard: services/pap-dashboard.md
  - Development:
    - Setup: development/setup.md
    - Testing: development/testing.md
    - Deployment: development/deployment.md
  - API Reference:
    - OPA Endpoints: api/opa.md
    - Preferences API: api/preferences.md
    - PAP API: api/pap.md

# Plugins
plugins:
  - search
  - mermaid2

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org/opa-pbac-poc
  version:
    provider: mike

# Custom CSS
extra_css:
  - stylesheets/extra.css
