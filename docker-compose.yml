services:
  opa:
    build:
      context: .
      dockerfile: opa/Dockerfile
    platform: linux/amd64
    ports:
      - '8181:8181'
    depends_on:
      - preferences-service

  preferences-service:
    build:
      context: ./mock-services
      dockerfile: Dockerfile
    ports:
      - '3002:3002'
    environment:
      - NODE_ENV=development
      - PORT=3002
    volumes:
      - ./mock-services:/app
      - /app/node_modules
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://localhost:3002/project-types'
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    ports:
      - '3003:8080'
    environment:
      - SWAGGER_JSON=/app/preferences-api.yaml
      - BASE_URL=/
      - DEEP_LINKING=true
      - DISPLAY_OPERATION_ID=false
      - DEFAULT_MODELS_EXPAND_DEPTH=1
      - DEFAULT_MODEL_EXPAND_DEPTH=1
      - DEFAULT_MODEL_RENDERING=example
      - DISPLAY_REQUEST_DURATION=true
      - DOC_EXPANSION=list
      - FILTER=true
      - MAX_DISPLAYED_TAGS=10
      - SHOW_EXTENSIONS=true
      - SHOW_COMMON_EXTENSIONS=true
      - TRY_IT_OUT_ENABLED=true
      - URLS=[{"url":"http://localhost:3002/api-spec","name":"Live API"}]
    volumes:
      - ./mock-services/preferences-api.yaml:/app/preferences-api.yaml:ro
    depends_on:
      - preferences-service
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://localhost:8080/'
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: opensearch-server
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node
      - discovery.type=single-node
      - plugins.security.disabled=true # Disable security for simplicity in this example
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Str0ngPassword!
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200" # OpenSearch HTTP port
      - "9600:9600" # OpenSearch Transport port
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data # Persistent data

volumes:
  opensearch-data:
