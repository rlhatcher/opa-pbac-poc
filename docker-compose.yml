services:
  opa:
    build:
      context: .
      dockerfile: opa/Dockerfile
    platform: linux/amd64
    ports:
      - '${OPA_PORT:-8181}:8181'
    environment:
      - OPA_LOG_LEVEL=${OPA_LOG_LEVEL:-info}
      - OPA_DECISION_LOGS_ENABLED=${OPA_DECISION_LOGS_ENABLED:-true}
    volumes:
      - ./logs:/logs
    depends_on:
      - preferences-service

  preferences-service:
    build:
      context: ./mock-services
      dockerfile: Dockerfile
    ports:
      - '${PREFERENCES_PORT:-3002}:3002'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3002
    volumes:
      - ./mock-services:/app
      - /app/node_modules
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://localhost:3002/project-types'
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    ports:
      - '${SWAGGER_UI_PORT:-3003}:8080'
    environment:
      - SWAGGER_JSON=/app/preferences-api.yaml
      - BASE_URL=/
      - DEEP_LINKING=true
      - DISPLAY_OPERATION_ID=false
      - DEFAULT_MODELS_EXPAND_DEPTH=1
      - DEFAULT_MODEL_EXPAND_DEPTH=1
      - DEFAULT_MODEL_RENDERING=example
      - DISPLAY_REQUEST_DURATION=true
      - DOC_EXPANSION=list
      - FILTER=true
      - MAX_DISPLAYED_TAGS=10
      - SHOW_EXTENSIONS=true
      - SHOW_COMMON_EXTENSIONS=true
      - TRY_IT_OUT_ENABLED=true
      - URLS=[{"url":"http://localhost:3002/api-spec","name":"Live API"}]
    volumes:
      - ./mock-services/preferences-api.yaml:/app/preferences-api.yaml:ro
    depends_on:
      - preferences-service
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://localhost:8080/'
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  pap-service:
    build:
      context: ./pap-service
      dockerfile: Dockerfile
    ports:
      - '${PAP_SERVICE_PORT:-3004}:3004'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3004
      - DOCKER_ENV=true
      - OPA_URL=${OPA_URL_DOCKER:-http://opa:8181}
      - PREFERENCES_URL=${PREFERENCES_URL_DOCKER:-http://preferences-service:3002}
      - SAM_API_URL=${SAM_API_URL_DOCKER:-http://host.docker.internal:3000}
      - SAM_LAMBDA_URL=${SAM_LAMBDA_URL_DOCKER:-http://host.docker.internal:3001}
      - OPA_CONTAINER_NAME=${OPA_CONTAINER_NAME:-opa-pbac-poc-opa-1}
      - PAP_AUTO_REFRESH=${PAP_AUTO_REFRESH:-true}
      - PAP_SOCKET_ENABLED=${PAP_SOCKET_ENABLED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./pap-service:/app
      - /app/node_modules
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - opa
      - preferences-service
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://localhost:3004/'
        ]
      interval: 10s
      timeout: 5s
      retries: 3
